# Site CertifLoop pour nginx + PHP-FPM, sans aucune IP dans les logs.
# Installe par deploy/install.sh (__DOMAIN__, __APP_DIR__ et __PHP_FPM_SOCK__ y sont remplaces).
# HTTPS : lancer ensuite `certbot --nginx -d __DOMAIN__`, qui ajoute le bloc 443.

# Limite de debit en memoire (jamais ecrite sur disque) : 10 req/s par client,
# rafales de 40. Filet contre les robots ; la vraie protection DDoS reste en amont.
limit_req_zone $binary_remote_addr zone=certifloop:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    # Domaine nu et www : certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__ trouve les deux.
    server_name __DOMAIN__ www.__DOMAIN__;
    root __APP_DIR__/public;
    index index.php;

    # Vie privee : pas de journal d'acces (il contiendrait l'IP de chaque visiteur).
    # nginx ecrit "client: <IP>" dans ses messages d'erreur et ne permet pas de le
    # retirer : on ne garde que les erreurs critiques, effacees apres 24 h
    # (deploy/logrotate/certifloop).
    access_log off;
    error_log /var/log/nginx/certifloop.error.log crit;

    client_max_body_size 10m;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=certifloop burst=40 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets construits par Vite, polices et videos de demo : cache long.
    location ~* ^/(build|media)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { log_not_found off; }
    location = /robots.txt  { log_not_found off; }

    location ~ \.php$ {
        limit_req zone=certifloop burst=40 nodelay;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Fichiers caches (.env, .git...) jamais servis.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
